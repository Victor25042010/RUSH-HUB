name: Atualizar calendário RaceHub

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4

      - name: Atualizar calendário
        run: |

          mkdir -p data

          cat > update.py <<'PY'

          import requests
          import json
          import re
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone
          from urllib.parse import quote


          SOURCES = {

              "F1": {
                  "url": "https://www.espn.com.br/f1/calendario",
                  "calendar": "https://www.espn.com.br/f1/calendario",
                  "source": "ESPN"
              },

              "WEC": {
                  "url": "https://motorsport.uol.com.br/wec/schedule/2026/",
                  "calendar": "https://motorsport.uol.com.br/wec/schedule/2026/",
                  "source": "Motorsport.com"
              },

              "STOCK CAR": {
                  "url": "https://motorsport.uol.com.br/stockcar-br/schedule/2026/",
                  "calendar": "https://motorsport.uol.com.br/stockcar-br/schedule/2026/",
                  "source": "Motorsport.com"
              }

          }


          HEADERS = {

              "User-Agent":
              "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"

          }


          def clean(text):

              return re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()


          def get_page(url):

              try:

                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=30
                  )

                  response.raise_for_status()

                  print(
                      "OK:",
                      url,
                      response.status_code
                  )

                  return response.text

              except Exception as error:

                  print(
                      "ERRO:",
                      url,
                      error
                  )

                  return ""


          def parse_motorsport(html, category):

              soup = BeautifulSoup(
                  html,
                  "html.parser"
              )

              races = []

              for table in soup.find_all("table"):

                  rows = table.find_all("tr")

                  if not rows:
                      continue


                  header = []

                  first_cells = rows[0].find_all(
                      ["th", "td"]
                  )

                  header = [
                      clean(x.get_text(" ", strip=True)).lower()
                      for x in first_cells
                  ]


                  date_index = None
                  event_index = None


                  for i, value in enumerate(header):

                      if "data" in value:
                          date_index = i

                      if (
                          "evento" in value
                          or "etapa" in value
                          or "circuit" in value
                          or "local" in value
                      ):
                          event_index = i


                  for row in rows[1:]:

                      cells = [
                          clean(
                              cell.get_text(
                                  " ",
                                  strip=True
                              )
                          )
                          for cell in row.find_all(
                              ["td", "th"]
                          )
                      ]


                      cells = [
                          x for x in cells if x
                      ]


                      if len(cells) < 2:
                          continue


                      # Ignora cabeçalhos
                      joined = " ".join(
                          cells
                      ).lower()


                      if (
                          "data evento" in joined
                          or joined == "data"
                          or joined == "evento"
                      ):
                          continue


                      if (
                          date_index is not None
                          and date_index < len(cells)
                      ):

                          date = cells[date_index]

                      else:

                          date = cells[0]


                      if (
                          event_index is not None
                          and event_index < len(cells)
                      ):

                          name = cells[event_index]

                      else:

                          name = cells[1]


                      if not name:
                          continue


                      races.append({

                          "category": category,

                          "name": name,

                          "date": date,

                          "source":
                              SOURCES[category]["source"],

                          "calendarUrl":
                              SOURCES[category]["calendar"]

                      })


              return races


          def parse_espn(html):

              soup = BeautifulSoup(
                  html,
                  "html.parser"
              )

              races = []


              # Primeiro tenta tabelas

              for table in soup.find_all("table"):

                  rows = table.find_all("tr")


                  for row in rows:

                      cells = [
                          clean(
                              x.get_text(
                                  " ",
                                  strip=True
                              )
                          )
                          for x in row.find_all(
                              ["td", "th"]
                          )
                      ]


                      cells = [
                          x for x in cells if x
                      ]


                      if len(cells) < 2:
                          continue


                      text = " ".join(
                          cells
                      )


                      lower = text.lower()


                      if (
                          "calendário" in lower
                          or lower == "data"
                          or lower == "evento"
                      ):
                          continue


                      races.append({

                          "category": "F1",

                          "name": cells[-1],

                          "date": cells[0],

                          "source": "ESPN",

                          "calendarUrl":
                              SOURCES["F1"]["calendar"]

                      })


              return races


          def add_transmission(race):

              category = race["category"]

              name = race["name"]


              if category == "F1":

                  race["transmission"] = "Globo"

                  race["transmissionUrl"] = \
                      "https://globoplay.globo.com/"

                  race["searchUrl"] = \
                      "https://www.google.com/search?q=" + \
                      quote(
                          name +
                          " F1 Globo transmissão"
                      )


              elif category == "WEC":

                  race["transmission"] = "YouTube"

                  race["transmissionUrl"] = ""

                  race["searchUrl"] = \
                      "https://www.youtube.com/results?search_query=" + \
                      quote(
                          name +
                          " WEC 2026 Grande Prêmio"
                      )


              elif category == "STOCK CAR":

                  race["transmission"] = "YouTube"

                  race["transmissionUrl"] = ""

                  race["searchUrl"] = \
                      "https://www.youtube.com/results?search_query=" + \
                      quote(
                          name +
                          " Stock Car Brasil 2026"
                      )


              race["status"] = "PRÓXIMO"

              return race


          all_races = []


          # ==========================
          # F1
          # ==========================

          print("Buscando F1...")

          f1_html = get_page(
              SOURCES["F1"]["url"]
          )


          if f1_html:

              f1_races = parse_espn(
                  f1_html
              )

              print(
                  "F1 encontradas:",
                  len(f1_races)
              )

              all_races.extend(
                  f1_races
              )


          # ==========================
          # WEC
          # ==========================

          print("Buscando WEC...")

          wec_html = get_page(
              SOURCES["WEC"]["url"]
          )


          if wec_html:

              wec_races = parse_motorsport(
                  wec_html,
                  "WEC"
              )

              print(
                  "WEC encontradas:",
                  len(wec_races)
              )

              all_races.extend(
                  wec_races
              )


          # ==========================
          # STOCK CAR
          # ==========================

          print("Buscando Stock Car...")

          stock_html = get_page(
              SOURCES["STOCK CAR"]["url"]
          )


          if stock_html:

              stock_races = parse_motorsport(
                  stock_html,
                  "STOCK CAR"
              )

              print(
                  "Stock Car encontradas:",
                  len(stock_races)
              )

              all_races.extend(
                  stock_races
              )


          # ==========================
          # Transmissões
          # ==========================

          for race in all_races:

              add_transmission(
                  race
              )


          # ==========================
          # Remover duplicados
          # ==========================

          unique = []

          seen = set()


          for race in all_races:

              key = (
                  race.get("category"),
                  race.get("name"),
                  race.get("date")
              )


              if key in seen:
                  continue


              seen.add(key)

              unique.append(
                  race
              )


          # ==========================
          # Salvar JSON
          # ==========================

          output = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "races":
                  unique

          }


          with open(
              "data/index.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "=============================="
          )

          print(
              "TOTAL DE CORRIDAS:",
              len(unique)
          )

          print(
              "=============================="
          )

          PY


          python update.py


      - name: Salvar alterações
        run: |

          git config user.name "RaceHub Bot"

          git config user.email "actions@github.com"

          git add data/index.json

          git diff --cached --quiet || \
          git commit -m "Atualizar calendário RaceHub"

          git push
