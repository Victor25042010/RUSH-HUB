<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RaceHub</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

<header class="header">
    <div class="logo">
        RACE<span>HUB</span>
    </div>

    <div class="online">
        <i></i> ATUALIZAÇÃO AUTOMÁTICA
    </div>
</header>


<main>

    <section class="hero">
        <span>AUTOMOBILISMO</span>

        <h1>
            Todas as corridas.<br>
            <strong>Um só lugar.</strong>
        </h1>

        <p>
            Calendários e transmissões das principais
            categorias de automobilismo.
        </p>
    </section>


    <section class="section">

        <div class="section-header">
            <div>
                <small>CALENDÁRIO</small>
                <h2>Corridas</h2>
            </div>

            <button id="refresh">↻</button>
        </div>


        <div class="filters">

            <button class="filter active" data-filter="TODAS">
                Todas
            </button>

            <button class="filter" data-filter="F1">
                F1
            </button>

            <button class="filter" data-filter="WEC">
                WEC
            </button>

            <button class="filter" data-filter="STOCK CAR">
                Stock Car
            </button>

        </div>


        <div id="status" class="status">
            Carregando calendário...
        </div>


        <div id="races"></div>

    </section>

</main>


<footer>

    <div>
        RaceHub
    </div>

    <span>
        Dados atualizados automaticamente
    </span>

</footer>


<script src="index.js"></script>

</body>
</html>
