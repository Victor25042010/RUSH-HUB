<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RushHub — Todas as corridas em um só lugar</title>

    <link rel="stylesheet" href="CSS/index.css">
</head>

<body>

    <!-- BACKGROUND -->
    <div class="hero">

        <div class="video-background">

            <video id="backgroundVideo" autoplay muted playsinline>
                <source src="assets/videos/f1.mp4" type="video/mp4">
            </video>

        </div>

        <div class="overlay"></div>

        <!-- CONTEÚDO -->
        <main class="hero-content">

            <div class="brand">
                RUSHHUB
            </div>

            <div class="line"></div>

            <h1>
                TODAS AS<br>
                <span>CORRIDAS.</span>
            </h1>

            <p>
                Calendários, categorias e informações das principais
                corridas do automobilismo em um só lugar.
            </p>

            <a href="categorias.html" class="explore-button">
                EXPLORAR CORRIDAS
                <span>→</span>
            </a>

        </main>

        <!-- CATEGORIA ATUAL -->
        <div class="category-indicator">
            <span id="categoryName">FORMULA 1</span>
            <div class="indicator-line">
                <div id="indicatorProgress"></div>
            </div>
        </div>

        <div class="scroll-indicator">
            SCROLL
            <span>↓</span>
        </div>

    </div>

    <script src="JS/index.js"></script>

</body>
</html>
