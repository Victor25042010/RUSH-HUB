<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RushHub — Todas as corridas em um só lugar</title>

    <link rel="stylesheet" href="CSS/index.css">
</head>

<body>

    <main class="hero">

        <!-- VÍDEO DE FUNDO -->
        <div class="video-background">
            <video
                id="backgroundVideo"
                autoplay
                muted
                playsinline
                preload="auto">
            </video>
        </div>

        <!-- CAMADA ESCURA -->
        <div class="overlay"></div>

        <!-- CONTEÚDO -->
        <section class="hero-content">

            <div class="brand">
                RUSHHUB
            </div>

            <div class="line"></div>

            <h1>
                TODAS AS<br>
                <span>CORRIDAS.</span>
            </h1>

            <p>
                Descubra calendários, categorias e informações
                das principais corridas do automobilismo.
            </p>

            <a href="categorias.html" class="explore-button">
                EXPLORAR CORRIDAS
                <span>→</span>
            </a>

        </section>

        <!-- CATEGORIA DO VÍDEO -->
        <div class="category-indicator">

            <span id="categoryName">
                FORMULA 1
            </span>

            <div class="indicator-line">
                <div id="indicatorProgress"></div>
            </div>

        </div>

        <!-- INDICADOR -->
        <div class="scroll-indicator">
            SCROLL
            <span>↓</span>
        </div>

    </main>

    <script src="JS/index.js"></script>

</body>
</html>
