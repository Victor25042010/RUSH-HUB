<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RaceHub</title>

    <link
        rel="stylesheet"
        href="Index.css"
    >

</head>


<body>


<header>

    <div class="logo">
        RACE<span>HUB</span>
    </div>

    <div class="status">

        <span></span>

        ONLINE

    </div>

</header>



<main>


<section class="hero">

    <p>AUTOMOBILISMO</p>

    <h1>
        Todas as corridas.<br>
        <strong>Um só lugar.</strong>
    </h1>

    <p class="description">

        Calendário, próximas etapas e
        transmissões em um único lugar.

    </p>

</section>



<section>

    <div class="section-header">

        <div>

            <small>AGORA</small>

            <h2>Eventos</h2>

        </div>


        <button
            onclick="loadRaces()"
            class="refresh"
        >

            ↻

        </button>

    </div>


    <div
        id="races"
        class="races"
    >

        <div class="loading">

            Carregando calendário...

        </div>

    </div>

</section>



<section>

    <small>CATEGORIAS</small>

    <div class="categories">

        <button onclick="filter('ALL')">
            Todas
        </button>

        <button onclick="filter('F1')">
            F1
        </button>

        <button onclick="filter('WEC')">
            WEC
        </button>

        <button onclick="filter('STOCK CAR')">
            Stock Car
        </button>

    </div>

</section>


</main>



<nav class="bottom">

    <a href="#">
        🏠
        <span>Início</span>
    </a>

    <a href="#races">
        🏁
        <span>Corridas</span>
    </a>

    <a href="#categorias">
        📅
        <span>Calendário</span>
    </a>

</nav>



<script src="Index.js"></script>

</body>

</html>
